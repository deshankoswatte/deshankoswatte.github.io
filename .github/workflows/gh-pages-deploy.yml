# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node and deploy the application to github pages.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions.

name: GH-pages deploy workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 14.x ]

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install the required packages
        run: npm ci

      - name: Build and export the application
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /deshankoswatte.github.io
      - run: npm run export
        env:
          NEXT_PUBLIC_BASE_PATH: /deshankoswatte.github.io
      - run: touch ./out/.nojekyll

      - name: Deploy the application to GH-pages 🚀
        uses: JamesIves/github-pages-deploy-action@4.1.5
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages # The branch the action should deploy to.
          FOLDER: out # The folder the action should deploy.
